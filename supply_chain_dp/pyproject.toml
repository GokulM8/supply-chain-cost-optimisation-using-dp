[build-system]
requires = ["hatchling"]
build-backend = "hatchling.buildapi"

[project]
name = "supply-chain-cost-optimization-engine"
version = "1.0.0"
description = "A Dynamic Programming based supply chain optimization system that computes the globally lowest-cost production, transportation, and inventory plan over a finite planning horizon."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Supply Chain Optimization Team", email = "contact@example.com"}
]
keywords = ["supply chain", "optimization", "dynamic programming", "inventory", "production"]
categories = [
    "Scientific/Engineering :: Optimization",
    "Software Development :: Libraries :: Python Modules",
    "Business :: Logistics",
    "Finance :: Accounting"
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "streamlit>=1.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.2",
    "pydantic>=2.5.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/example/supply-chain-cost-optimizer"
Repository = "https://github.com/example/supply-chain-cost-optimizer"
"Bug Tracker" = "https://github.com/example/supply-chain-cost-optimizer/issues"
Documentation = "https://supply-chain-optimizer.readthedocs.io/"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "dashboard"]

[tool.hatch.build.targets.sdist]
packages = ["engine", "api", "dashboard"]

[tool.pyright]
# Python linting configuration
line-length = 100
target-version = "py38"
include = ["engine/", "api/", "dashboard/"]
exclude = ["tests/"]

[tool.black]
line-length = 100
target-version = 'py38'
include = '\.pyi?$'
extend = '\.py$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | __pycache__
  | env
  | .venv
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
tkip_unused_imports = true
force_sort_within_sections = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
    "__pycache__/",
]